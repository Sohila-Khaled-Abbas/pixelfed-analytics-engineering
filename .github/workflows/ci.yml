name: CI Pipeline - Analytics Engineering Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Build, Lint & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint and code style check (ruff)
        run: |
          ruff check . --ignore E501
          ruff format --check .

      - name: Run automated test suite (pytest)
        run: |
          pytest -v --durations=10

      - name: Run small-scale synthetic generation dry-run
        run: |
          python src/generate_landing.py --scale 0.02 --seed 999 --output-dir ./tmp_landing_ci

      - name: Validate generated CI landing zone
        run: |
          python src/validate_landing.py --landing ./tmp_landing_ci

      - name: Build and validate core engagement galaxy
        run: |
          python src/build_analytics.py --landing ./tmp_landing_ci --output ./tmp_analytics_ci

      - name: Run partitioned event-stream smoke test
        run: |
          python src/generate_activity_stream.py --events 10000 --profiles 2000 --start-date 2026-01-01 --as-of 2026-03-18T12:00:00Z --seed 42 --output-dir ./tmp_activity_stream_ci
