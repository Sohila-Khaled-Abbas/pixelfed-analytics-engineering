name: Temporary Ruff Formatting Pass

on:
  push:
    branches:
      - fix/validation-and-ci-errors

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/validation-and-ci-errors

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply the repository's configured Ruff formatter
        run: ruff format .

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "style: apply Ruff formatting"
            git push origin HEAD:fix/validation-and-ci-errors
          fi
