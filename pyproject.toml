[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelfed-analytics-engineering"
version = "1.0.0"
description = "PixelFed-inspired synthetic lakehouse, scalable activity event workloads, and Power BI semantic model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PixelFed Analytics Engineering Contributors" }
]
keywords = [
    "analytics-engineering",
    "power-bi",
    "lakehouse",
    "synthetic-data",
    "data-contracts",
    "star-schema",
    "dimensional-modeling",
    "tmdl",
    "dax"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Faker>=24.0",
    "tzdata>=2024.1",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<4.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/Sohila-Khaled-Abbas/pixelfed-analytics-engineering"
Repository = "https://github.com/Sohila-Khaled-Abbas/pixelfed-analytics-engineering.git"
Documentation = "https://github.com/Sohila-Khaled-Abbas/pixelfed-analytics-engineering/tree/main/docs"
SourceSchema = "https://drawsql.app/templates/pixelfed"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
